x-airflow-common: &airflow-common
  build: .
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    WAREHOUSE_DSN: postgresql://traffic:traffic@warehouse:5432/traffic
    DBT_PROFILES_DIR: /opt/project/traffic_dbt
    TRAFFIC_DB_HOST: warehouse
    TRAFFIC_DB_PORT: "5432"
    TRAFFIC_DB_NAME: traffic
    TRAFFIC_DB_USER: traffic
    TRAFFIC_DB_PASSWORD: traffic
    PYTHONPATH: /opt/project
  volumes:
    - ./:/opt/project
    - traffic_airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - traffic_airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5544:5432"
    volumes:
      - traffic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Data \
          --lastname Engineer \
          --role Admin \
          --email airflow@example.com || true
    restart: "no"

  airflow:
    <<: *airflow-common
    command: webserver
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 12
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.52.12
    ports:
      - "3004:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - traffic_metabase:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  traffic_pgdata:
  traffic_airflow_db:
  traffic_airflow_logs:
  traffic_metabase:

