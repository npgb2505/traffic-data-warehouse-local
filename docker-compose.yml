services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5544:5432"
    volumes:
      - traffic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build: .
    command: standalone
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      WAREHOUSE_DSN: postgresql://traffic:traffic@warehouse:5432/traffic
      DBT_PROFILES_DIR: /opt/project/traffic_dbt
      TRAFFIC_DB_HOST: warehouse
      TRAFFIC_DB_PORT: "5432"
      TRAFFIC_DB_NAME: traffic
      TRAFFIC_DB_USER: traffic
      TRAFFIC_DB_PASSWORD: traffic
      PYTHONPATH: /opt/project
    ports:
      - "8084:8080"
    volumes:
      - ./:/opt/project
      - traffic_airflow:/opt/airflow
    depends_on:
      warehouse:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.52.12
    ports:
      - "3004:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - traffic_metabase:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  traffic_pgdata:
  traffic_airflow:
  traffic_metabase:

