version: 2

models:
  - name: stg_traffic_observations
    description: Typed UCI Metro Interstate Traffic observations with derived analytical fields.
    columns:
      - name: observation_id
        tests: [not_null, unique]
      - name: observed_at
        tests: [not_null]
      - name: weather_key
        tests: [not_null]
      - name: traffic_volume
        tests: [not_null]
      - name: traffic_state
        tests:
          - accepted_values:
              values: ["light", "moderate", "heavy"]

  - name: dim_weather
    columns:
      - name: weather_key
        tests: [not_null, unique]

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: fct_traffic_observation
    description: Incremental observation-grain traffic fact table.
    columns:
      - name: observation_id
        tests: [not_null, unique]
      - name: weather_key
        tests:
          - relationships:
              to: ref('dim_weather')
              field: weather_key
      - name: observation_date
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: traffic_volume
        tests: [not_null]
