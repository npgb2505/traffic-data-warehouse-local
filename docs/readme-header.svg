    <text x="58" y="137" font-size="50" font-weight="750" fill="#f0fffb">Metro Traffic Lakehouse</text>
    <text x="58" y="179" font-size="24" font-weight="500" fill="#aad8ce">Incremental dbt models for traffic × weather analysis</text>
    <g font-size="15" fill="#bad8d1">
