<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Metro Interstate Traffic Data Warehouse</title>
  <desc id="desc">A dark green and amber road and weather warehouse illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b1a"/>
      <stop offset="1" stop-color="#123f3c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#345853"/>
      <stop offset="1" stop-color="#142b29"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020b0a" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="20" r="170" fill="#38d9a9" opacity=".07"/>
  <path d="M0 274 C245 235 406 313 630 276 S980 226 1200 265 V320 H0Z" fill="#38d9a9" opacity=".05"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
