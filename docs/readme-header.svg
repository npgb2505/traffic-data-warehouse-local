      <circle cx="353" cy="225" r="3" fill="#ffb547"/>
      <text x="368" y="230">7 analytical models</text>
    </g>
    <rect x="58" y="258" width="355" height="4" rx="2" fill="#38d9a9"/>
    <rect x="413" y="258" width="68" height="4" rx="2" fill="#ffb547"/>
  </g>

  <g transform="translate(755 22)" filter="url(#shadow)">
