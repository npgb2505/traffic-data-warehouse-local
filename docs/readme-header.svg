    <path d="M240 35 V77 M240 103 V145 M240 171 V213 M240 239 V276" stroke="#ffcf70" stroke-width="8" stroke-linecap="round"/>
    <g>
      <rect x="122" y="196" width="52" height="30" rx="8" fill="#38d9a9"/>
      <circle cx="134" cy="226" r="7" fill="#0b201e"/>
